<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="vw-gui">
  <title>vw-gui tray</title>
  <!--
    Tray variant. No card, no gradients, heavier strokes and a tighter box:
    at 16px the rounded background eats most of the pixels and the gradient
    averages to a smudge. Flat colour on transparent survives the downscale.
  -->
  <path d="M 132 96 L 300 256 L 132 416"
        fill="none" stroke="#8189F5" stroke-width="84"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="112" y="446" width="288" height="52" rx="26" fill="#FF8A6B"/>
</svg>
